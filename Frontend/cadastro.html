<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contentlogin">
        <h1>Cadastro</h1>
        <form id="formCadastro">
            <label for="nome_cliente">Usuário:</label>
            <input type="text" id="nome_cliente" name="nome_cliente" required>
            <label for="email_cliente">Email:</label>
            <input type="email" id="email_cliente" name="email_cliente" required>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" title="Insira um CPF válido no formato 000.000.000-00 ou apenas os 11 números" required>
            <label for="n_contato_cliente">Número de celular:</label>
            <input type="tel" id="n_contato_cliente" name="n_contato_cliente" placeholder="(11) 99999-9999" pattern="(\(\d{2}\)\s?\d{4,5}-?\d{4}|\d{10,11})" title="Digite um número no formato (11) 99999-9999 ou apenas números com DDD" required>
            <label for="senha_cliente">Senha:</label>
            <input type="password" id="senha_cliente" name="senha_cliente" required>
            <a href="login.html">Já tem uma conta? Faça login</a>
            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
