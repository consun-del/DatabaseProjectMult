<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="contentlogin"><!--Elementos do container de login-->
        <h1>Cadastro</h1>
        <form action="login.html" method="get">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" title="Porfavor insira um CPF valido no formato 000.000.000-00 ou insira 11 números" required>
            <label for="phone">número de celular:</Label>
            <input type="tel" id="phone" name="phone" placeholder="(11) 99999-9999" pattern="\(\d{2}\)\s?\d{5}-\d{4}" title="Porfavor digite um número no formato (11) 99999-9999">
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
            <a href="login.html">Já tem uma conta? Faça login</a>
            <button type="submit">Cadastrar</button>
        </form>
    </div>
    
</body>
</html>
