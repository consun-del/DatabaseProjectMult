<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css"><!--link para o arquivo CSS("style.css")-->
    <title>Login</title>
</head>
<body>
    <div class="contentlogin"><!--Elementos do container de login-->
        <h1>Login</h1><!--Texto principal da página de login-->
        <form id="formLogin">
            <label for="email_cliente">Email:</label>
            <input type="email" id="email_cliente" name="email_cliente" required>

            <label for="senha_cliente">Senha:</label>
            <input type="password" id="senha_cliente" name="senha_cliente" required>
            
            <a href="cadastro.html">Não tem uma conta? Cadastre-se</a>
            <button type="submit">Entrar</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
